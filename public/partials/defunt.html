<div class="form-section">
    <h2>📋 Informations sur le défunt</h2>
    <div class="form-group">
        <label for="estateValue">Valeur totale de la succession (en €)</label>
        <input type="number" id="estateValue" placeholder="Entrez le montant total" min="0">
    </div>
    <div class="form-group">
        <label for="deceasedGender">Genre du défunt</label>
        <select id="deceasedGender" onchange="toggleSpouseFields()">
            <option value="male">Homme</option>
            <option value="female">Femme</option>
        </select>
    </div>
</div>
<button class="btn" onclick="switchTab('heritiers')">Suivant →</button>
